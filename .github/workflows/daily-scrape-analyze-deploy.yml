# This workflow orchestrates the daily data scrape/analysis,
# commits the updated data, builds the Astro site, and deploys it to GitHub Pages.
name: Scrape, Analyze, and Deploy Website

on:
  # Schedule the workflow to run daily at 20:00 UTC
  schedule:
    - cron: '0 18 * * *' # UTC timezone (18:00 UTC = 20:00 CEST)

  # Allow manual triggering of the workflow from the GitHub Actions tab
  workflow_dispatch: {}

# Set permissions needed for the actions
permissions:
  contents: write # Needed to commit changes to the data directory
  pages: write # Needed to deploy to GitHub Pages
  id-token: write # Needed for the Deploy Pages action (OIDC)

jobs:
  # --- Job 1: Scrape, Analyze, and Process All Data ---
  scrape_and_process:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.commit_step.outputs.data_changed }}
      new_commit_sha: ${{ steps.commit_step.outputs.sha }}
    secrets: inherit

    steps:
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Analyzer Environment
        uses: ./.github/actions/analyzer-setup

      - name: Archive previous day's data for diffing
        run: |
          mv data/scraped/minv_2_documents.json data/scraped/minv_2_documents_old.json || true
          mv data/scraped/minzp_documents.json data/scraped/minzp_documents_old.json || true
        continue-on-error: true # Don't fail if files don't exist on first run

      - name: Run Scrapers
        id: scraping
        run: python analyzer/run_scraping.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Document Processing
        id: processing
        run: python analyzer/run_processing.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and Push Data Changes
        id: commit_step
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff-index --quiet HEAD --; then
            echo "No data changes detected to commit."
            echo "data_changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "data: Daily update ($(date +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin main
            NEW_SHA=$(git rev-parse HEAD)
            echo "sha=$NEW_SHA" >> $GITHUB_OUTPUT
            echo "data_changed=true" >> $GITHUB_OUTPUT
            echo "Data changes committed and pushed."
          fi

  # --- Job 2: Build Website ---
  build_website:
    runs-on: ubuntu-latest
    needs: scrape_and_process
    if: needs.scrape_and_process.outputs.data_changed == 'true'

    steps:
      - name: Checkout specific commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.scrape_and_process.outputs.new_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./website/package-lock.json

      - name: Install Website Dependencies
        run: npm install
        working-directory: ./website

      - name: Build Astro Site
        run: npm run build
        working-directory: ./website

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website/dist'

  # --- Job 3: Deploy Website ---
  deploy_website:
    runs-on: ubuntu-latest
    needs: build_website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
