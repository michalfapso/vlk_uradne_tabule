name: Process Data

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      download_artifact_locally:
        type: boolean
        default: false
    outputs:
      data_changed:
        description: "Whether any data changes were committed"
        value: ${{ jobs.process.outputs.data_changed }}
      new_commit_sha:
        description: "The SHA of the new commit if changes were pushed"
        value: ${{ jobs.process.outputs.new_commit_sha }}
  workflow_run:
    workflows: ["Scrape Data"]
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  process:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.commit_step.outputs.data_changed }}
      new_commit_sha: ${{ steps.commit_step.outputs.sha }}

    steps:
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Analyzer Environment
        uses: ./.github/actions/analyzer-setup

      - name: Download Scraped Data (Local)
        if: inputs.download_artifact_locally == true
        uses: actions/download-artifact@v4
        with:
          name: scraped-data
          path: data/scraped

      - name: Clean Scraped Data Directory
        if: inputs.download_artifact_locally != true
        run: rm -f data/scraped/*.json

      - name: Download Scraped Data (Remote)
        if: inputs.download_artifact_locally != true
        uses: ./.github/actions/download-workflow-artifact
        with:
          workflows: "scrape.yml"
          run_id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          artifact: "scraped-data"
          path: "data/scraped"

      - name: Download previous GIS data
        uses: ./.github/actions/download-workflow-artifact
        with:
          workflows: "daily-scrape-analyze-deploy.yml process.yml"
          artifact: "gis-geojson-files"
          path: "."
        continue-on-error: true

      - name: Run Document Processing
        id: processing
        run: python -u analyzer/run_processing.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GIS_PROXY_URL: ${{ secrets.GIS_PROXY_URL }}
          GIS_PROXY_AUTH: ${{ secrets.GIS_PROXY_AUTH }}

      - name: Upload unified_new artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified
          path: |
            data/scraped/unified_new.json
            data/scraped/unified_old.json
            data/scraped/documents_to_process.json

      - name: Prune old GIS files
        run: python -u analyzer/prune_gis_files.py

      - name: Upload GIS GeoJSON files artifact
        uses: actions/upload-artifact@v4
        with:
          name: gis-geojson-files
          path: data/docs/**/gis.geojson

      - name: Archive data for diffing in the next run
        run: |
          mv data/scraped/minv_2_documents.json data/scraped/minv_2_documents_old.json
          mv data/scraped/minzp_2_documents.json data/scraped/minzp_2_documents_old.json

      - name: Commit and Push Data Changes
        id: commit_step
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff-index --quiet HEAD --; then
            echo "No data changes detected to commit."
            echo "data_changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "data: Daily update ($(date +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin main
            NEW_SHA=$(git rev-parse HEAD)
            echo "sha=$NEW_SHA" >> $GITHUB_OUTPUT
            echo "data_changed=true" >> $GITHUB_OUTPUT
            echo "Data changes committed and pushed."
          fi
